name: ci

on:
  push:
    branches: [main, 't3/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/check.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle -p android testDebugUnitTest --no-daemon --stacktrace
      # Pull requests (and forks) build unsigned; pushes here build the signed APK.
      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.MUSH_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "MUSH_KEYSTORE_B64 secret is missing"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mush.p12"
          echo "MUSH_KEYSTORE=$RUNNER_TEMP/mush.p12" >> "$GITHUB_ENV"
      - name: Build
        env:
          MUSH_KEYSTORE_PASSWORD: ${{ secrets.MUSH_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Package
        run: |
          out=android/app/build/outputs/apk/release
          mkdir -p dist
          apk=$(ls "$out"/*.apk | head -1)
          cp "$apk" dist/mush.apk
          code=$(grep -oP 'versionCode = \K[0-9]+' android/app/build.gradle.kts)
          name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          printf '{"versionCode": %s, "versionName": "%s", "sha": "%s"}\n' "$code" "$name" "$GITHUB_SHA" > dist/version.json
          rm -f "$RUNNER_TEMP/mush.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mush-android
          path: dist/
          retention-days: 30
